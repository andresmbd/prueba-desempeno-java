version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: taller-express-container
    restart: always
    environment:
      POSTGRES_DB: tallerexpress_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tallerexpress_volume:/var/lib/postgresql/data

volumes:
  tallerexpress_volume:
